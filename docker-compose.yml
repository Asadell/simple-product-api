services:
  api:
    image: ghcr.io/YOUR_GITHUB_USERNAME/simple-dotnet-api:latest
    container_name: simple_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=simple_api_db;Username=postgres;Password=${DB_PASSWORD}"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Jwt__Issuer: "SimpleApi"
      Jwt__Audience: "SimpleApiUsers"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: simple_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simple_api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
